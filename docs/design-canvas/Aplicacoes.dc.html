<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Aplicações da marca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
body{margin:0;background:#0E0D0C}
</style>
</helmet>
<div style="width:1280px;height:780px;box-sizing:border-box;padding:40px;background:#0E0D0C;color:#F4F1EC;font-family:'Geist',sans-serif;display:grid;grid-template-columns:420px minmax(0,1fr);gap:24px">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
      <symbol id="q" viewBox="0 0 200 200">
        <g transform="translate(88 88) rotate(-45)">
          <g fill="none" stroke="#FF4F81" stroke-width="16" stroke-linecap="round"><path d="M29.100 54.700A62 62 0 1 0 -29.100 54.700"/><path d="M29.100 54.700L21 72M-29.100 54.700L-21 72"/></g>
          <rect x="-21" y="78" width="42" height="13" rx="6.500" fill="#FF4F81"/><rect x="-15" y="95" width="30" height="11" rx="5.500" fill="#FF4F81"/>
          <circle cx="0" cy="-2" r="13" fill="#F2A65A"/>
        </g>
      </symbol>
      <symbol id="qm" viewBox="0 0 200 200">
        <g transform="translate(88 88) rotate(-45)" fill="currentColor" stroke="currentColor">
          <g fill="none" stroke-width="16" stroke-linecap="round"><path d="M29.100 54.700A62 62 0 1 0 -29.100 54.700"/><path d="M29.100 54.700L21 72M-29.100 54.700L-21 72"/></g>
          <rect x="-21" y="78" width="42" height="13" rx="6.500" stroke="none"/><rect x="-15" y="95" width="30" height="11" rx="5.500" stroke="none"/>
          <circle cx="0" cy="-2" r="13" stroke="none"/>
        </g>
      </symbol>
      <symbol id="qn" viewBox="0 0 200 200">
        <g transform="translate(88 88) rotate(-45)">
          <g fill="none" stroke="#FF4F81" stroke-width="12" stroke-linecap="round" opacity=".6" filter="url(#glow)"><path d="M29.100 54.700A62 62 0 1 0 -29.100 54.700"/><path d="M29.100 54.700L21 72M-29.100 54.700L-21 72"/><rect x="-21" y="78" width="42" height="13" rx="6.500"/><rect x="-15" y="95" width="30" height="11" rx="5.500"/></g>
          <g fill="none" stroke="#FF4F81" stroke-width="7" stroke-linecap="round"><path d="M29.100 54.700A62 62 0 1 0 -29.100 54.700"/><path d="M29.100 54.700L21 72M-29.100 54.700L-21 72"/><rect x="-21" y="78" width="42" height="13" rx="6.500"/><rect x="-15" y="95" width="30" height="11" rx="5.500"/></g>
          <g fill="none" stroke="#FFC2D1" stroke-width="2.500" stroke-linecap="round"><path d="M29.100 54.700A62 62 0 1 0 -29.100 54.700"/><path d="M29.100 54.700L21 72M-29.100 54.700L-21 72"/><rect x="-21" y="78" width="42" height="13" rx="6.500"/><rect x="-15" y="95" width="30" height="11" rx="5.500"/></g>
          <circle cx="0" cy="-2" r="22" fill="#F2A65A" opacity=".55" filter="url(#glow)"/><circle cx="0" cy="-2" r="11" fill="#F2A65A"/><circle cx="-3" cy="-5" r="4" fill="#FFE2A8"/>
        </g>
      </symbol>
      <path id="rim" d="M100 100m-74 0a74 74 0 1 1 148 0a74 74 0 1 1 -148 0"/>
    </defs>
  </svg>

  <section aria-label="Adesivo de vitrine" style="background:#1B1A18;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px">
    <div style="font-size:14px;font-weight:600;color:#A8A29A">Adesivo de vitrine</div>
    <div style="flex:1;position:relative;border-radius:16px;background:#14100F;overflow:hidden">
      <div style="position:absolute;left:36px;right:36px;top:36px;bottom:36px;border-radius:8px;border:6px solid #2A2825;background:linear-gradient(160deg,#2A1A1F,#1B1013)"></div>
      <div style="position:absolute;left:62px;top:80px;width:60px;height:300px;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,0))"></div>
      <div style="position:absolute;right:56px;top:300px;width:10px;height:120px;border-radius:5px;background:#A8A29A"></div>
      <svg width="190" height="190" viewBox="0 0 200 200" style="position:absolute;left:100px;top:150px" role="img" aria-label="Selo Tá na Qual a boa">
        <circle cx="100" cy="100" r="98" fill="#6B1D3A" stroke="#FFC2D1" stroke-width="3"/>
        <text font-family="Outfit, Arial, sans-serif" font-weight="700" font-size="15" fill="#FFC2D1"><textPath href="#rim" startOffset="0" textLength="455" lengthAdjust="spacing">ACENDE A NOITE · TÁ NA QUAL A BOA ·</textPath></text>
        <g transform="translate(55 38) scale(.45)"><use href="#q" width="200" height="200"/></g>
        <text x="100" y="152" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-weight="700" font-size="20" fill="#F4F1EC">hoje</text>
      </svg>
    </div>
    <div style="font-size:14px;color:#A8A29A;line-height:1.5">Selo para casas parceiras. Vinil de recorte, 15 cm.</div>
  </section>

  <div style="display:flex;flex-direction:column;gap:24px;min-width:0">
    <section aria-label="Pulseira" style="background:#1B1A18;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px">
      <div style="font-size:14px;font-weight:600;color:#A8A29A">Pulseira de evento</div>
      <div style="height:68px;border-radius:12px;background:#FF4F81;color:#1A0A06;display:flex;align-items:center;gap:20px;padding:0 24px;overflow:hidden;white-space:nowrap">
        <svg width="40" height="40" viewBox="0 0 200 200" aria-hidden="true" style="flex:none"><use href="#qm"/></svg>
        <span style="font-family:'Outfit',sans-serif;font-weight:700;font-size:26px;letter-spacing:-0.01em">Qual a boa? · 23.10 · BOLT</span>
        <svg width="40" height="40" viewBox="0 0 200 200" aria-hidden="true" style="flex:none"><use href="#qm"/></svg>
        <span style="font-family:'Outfit',sans-serif;font-weight:700;font-size:26px;letter-spacing:-0.01em">Qual a boa? · 23.10 · BOLT</span>
        <svg width="40" height="40" viewBox="0 0 200 200" aria-hidden="true" style="flex:none"><use href="#qm"/></svg>
      </div>
    </section>

    <section aria-label="Gráfico da loja" style="flex:1;background:#1B1A18;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px">
      <div style="font-size:14px;font-weight:600;color:#A8A29A">Gráfico de destaque da loja (1024×500)</div>
      <div style="position:relative;width:640px;height:312px;overflow:hidden;border-radius:12px;background:#3A1220">
        <div style="position:absolute;inset:0;background:radial-gradient(circle at 24% 50%,#6B1D3A 0%,#3A1220 62%,#241014 100%)"></div>
        <svg width="220" height="220" viewBox="0 0 200 200" style="position:absolute;left:32px;top:46px" aria-hidden="true"><use href="#qn"/></svg>
        <div style="position:absolute;left:290px;top:60px;right:24px;display:flex;flex-direction:column;gap:10px">
          <div style="font-family:'Outfit',sans-serif;font-weight:700;font-size:46px;letter-spacing:-0.03em;line-height:1">Qual a boa<br>hoje<span style="color:#FF4F81">?</span></div>
          <div style="font-size:18px;color:#FFC2D1">Festas e casas de Vitória, por estilo, preço e distância.</div>
          <div style="display:flex;gap:8px;margin-top:6px"><span style="height:36px;padding:0 14px;border-radius:999px;background:#FF4F81;color:#1A0A06;font-size:14px;font-weight:600;display:flex;align-items:center">Pagode</span><span style="height:36px;padding:0 14px;border-radius:999px;background:#262421;font-size:14px;font-weight:500;display:flex;align-items:center">Funk</span><span style="height:36px;padding:0 14px;border-radius:999px;background:#262421;font-size:14px;font-weight:500;display:flex;align-items:center">Eletrônica</span></div>
        </div>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":780}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
